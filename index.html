<title>Mi Calendario</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Google Sans',Roboto,Arial,sans-serif}
:root{--blue:#1a73e8;--blue-light:#e8f0fe;--surface:#fff;--bg:#f6f8fc;--border:#dadce0;--text:#3c4043;--muted:#70757a;--hover:#f1f3f4}
html,body{height:100%;background:var(--bg);color:var(--text);font-size:14px}
.cal-root{display:flex;flex-direction:column;height:100vh;overflow:hidden}

/* TOPBAR */
.topbar{height:56px;display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid var(--border);background:var(--surface);flex-shrink:0}
.topbar-logo{font-size:20px;color:var(--muted);font-weight:400}
.topbar-logo span{color:var(--blue)}
.today-btn{border:1px solid var(--border);background:var(--surface);border-radius:4px;padding:6px 12px;font-size:13px;cursor:pointer;color:var(--text);font-weight:500}
.today-btn:hover{background:var(--hover)}
.nav-btn{background:none;border:none;cursor:pointer;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--muted)}
.nav-btn:hover{background:var(--hover)}
.topbar-month{font-size:17px;font-weight:400;color:var(--text);flex:1}

/* GRID MES */
.month-wrap{flex:1;display:flex;flex-direction:column;overflow:hidden}
.month-dow-header{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--border);background:var(--surface);flex-shrink:0}
.month-dow{text-align:center;padding:5px 0;font-size:10px;font-weight:500;color:var(--muted);letter-spacing:.3px}
.month-grid{flex:1;display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:1fr;border-left:1px solid var(--border);overflow:hidden}
.month-cell{border-right:1px solid var(--border);border-bottom:1px solid var(--border);padding:3px;cursor:pointer;background:var(--surface);overflow:hidden}
.month-cell:hover{background:#fafafa}
.month-cell.other-month{background:var(--bg)}
.month-cell.other-month .cell-num{color:#bbb}
.cell-num{font-size:11px;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 2px auto;color:var(--text);line-height:22px;text-align:center;padding:0}
.cell-num.today{background:var(--blue);color:#fff;font-weight:500}
.cell-events{display:flex;flex-direction:column;gap:2px}
.cell-event{font-size:11px;font-weight:700;color:#fff;border-radius:4px;padding:3px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3;letter-spacing:.1px;text-shadow:0 1px 2px rgba(0,0,0,.25)}
.cell-more{font-size:10px;color:var(--muted);padding:2px 4px;font-weight:600}

/* ===== MODAL PRINCIPAL ===== */
.modal-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;align-items:flex-end;justify-content:center}
@media(min-width:640px){.modal-backdrop{align-items:center}}
.modal-backdrop.open{display:flex}
.modal-box{background:#fff;border-radius:16px 16px 0 0;width:100%;max-height:95vh;overflow-y:auto;display:flex;flex-direction:column}
@media(min-width:640px){.modal-box{border-radius:14px;width:580px;max-height:92vh}}
.modal-head{padding:14px 18px 10px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:#fff;z-index:2;flex-shrink:0}
.modal-head-date{font-size:15px;font-weight:600;color:var(--text)}
.modal-close{background:none;border:none;font-size:20px;cursor:pointer;color:var(--muted);width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.modal-close:hover{background:var(--hover)}
.modal-body{padding:14px 18px;flex:1;overflow-y:auto}
.sec-label{font-size:10px;font-weight:600;color:var(--muted);letter-spacing:.9px;text-transform:uppercase;margin-bottom:8px}

/* Tipos evento */
.tipo-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:18px}
.tipo-btn{border:none;border-radius:9px;padding:14px 8px;font-size:12px;font-weight:700;color:rgba(255,255,255,.75);cursor:pointer;text-transform:uppercase;letter-spacing:.3px;transition:transform .15s,box-shadow .15s,opacity .15s,filter .15s;opacity:.38;filter:saturate(0.3) brightness(0.85)}
.tipo-btn:hover{opacity:.55;filter:saturate(0.6) brightness(0.92)}
.tipo-btn.selected{opacity:1;filter:none;color:#fff;transform:scale(1.06);box-shadow:0 0 0 3px #fff,0 0 0 6px currentColor,0 6px 20px rgba(0,0,0,.3)}

/* Selector de estado y tipo con botón */
.selector-field{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--border);border-radius:8px;padding:10px 14px;cursor:pointer;margin-bottom:16px;background:#fff}
.selector-field:hover{border-color:var(--blue)}
.selector-field .sel-label{font-size:13px;color:var(--muted)}
.selector-field .sel-value{display:flex;align-items:center;gap:8px}
.sel-badge{padding:4px 12px;border-radius:20px;font-size:12px;font-weight:600;display:inline-block}
.sel-arrow{color:var(--muted);font-size:12px}

/* Gestores */
.gestor-row{display:flex;gap:8px;margin-bottom:16px}
.gestor-btn{flex:1;border:2px solid transparent;border-radius:9px;padding:12px 6px;font-size:12px;font-weight:700;color:#fff;cursor:pointer;text-transform:uppercase;letter-spacing:.3px;transition:all .15s;opacity:.3;filter:grayscale(60%)}
.gestor-btn.active{opacity:1;filter:none;box-shadow:0 0 0 3px #fff,0 0 16px 4px rgba(0,0,0,.2);transform:scale(1.06)}

/* Inputs numéricos y texto */
.input-row{display:flex;gap:12px;margin-bottom:16px}
.form-group{display:flex;flex-direction:column;gap:4px;flex:1}
.form-group label{font-size:10px;font-weight:600;color:var(--muted);letter-spacing:.7px;text-transform:uppercase}
.form-group input[type=time],.form-group input[type=number],.form-group input[type=text]{border:1px solid var(--border);border-radius:7px;padding:8px 10px;font-size:14px;color:var(--text);outline:none;background:#fff;width:100%}
.form-group input:focus{border-color:var(--blue)}

/* Autocomplete cliente/agencia */
.autocomplete-wrap{position:relative;margin-bottom:16px}
.autocomplete-wrap input{width:100%;border:1px solid var(--border);border-radius:7px;padding:9px 12px;font-size:14px;color:var(--text);outline:none}
.autocomplete-wrap input:focus{border-color:var(--blue)}
.autocomplete-dropdown{position:absolute;top:calc(100% + 4px);left:0;right:0;background:#fff;border:1px solid var(--border);border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,.12);z-index:50;max-height:180px;overflow-y:auto;display:none}
.autocomplete-dropdown.open{display:block}
.ac-item{padding:9px 14px;cursor:pointer;font-size:13px;color:var(--text)}
.ac-item:hover{background:var(--hover)}
.ac-add{padding:9px 14px;cursor:pointer;font-size:13px;color:var(--blue);font-weight:500;border-top:1px solid var(--border)}
.ac-add:hover{background:var(--blue-light)}

/* Footer modal */
.modal-footer{padding:10px 18px 16px;display:flex;justify-content:flex-end;gap:10px;border-top:1px solid var(--border);position:sticky;bottom:0;background:#fff;flex-shrink:0}
.btn-cancel{background:none;border:1px solid var(--border);padding:8px 16px;border-radius:7px;cursor:pointer;font-size:13px;color:var(--muted)}
.btn-save{background:var(--blue);border:none;padding:8px 20px;border-radius:7px;cursor:pointer;font-size:13px;color:#fff;font-weight:600}
.btn-save:hover{background:#1557b0}

/* ===== POPUP RESUMEN ===== */
.popup{display:none;position:fixed;z-index:300;background:#fff;border-radius:14px;box-shadow:0 8px 32px rgba(0,0,0,.22);width:88vw;max-width:360px;overflow:hidden}
.popup.open{display:block}
.popup-head{padding:14px 16px 10px;display:flex;align-items:center;gap:10px}
.popup-dot{width:14px;height:14px;border-radius:50%;flex-shrink:0}
.popup-titulo{font-size:17px;font-weight:700;color:var(--text);flex:1;line-height:1.2}
.popup-close{background:none;border:none;font-size:18px;cursor:pointer;color:var(--muted);width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.popup-close:hover{background:var(--hover)}
.popup-body{padding:4px 16px 14px;display:flex;flex-direction:column;gap:8px}
.popup-row{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--text)}
.popup-icon{font-size:16px;width:20px;text-align:center;flex-shrink:0}
.popup-badge{padding:3px 10px;border-radius:12px;font-size:12px;font-weight:700;display:inline-block}
.popup-footer{padding:10px 16px 14px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}
.popup-edit-btn{background:var(--blue);border:none;padding:8px 18px;border-radius:7px;cursor:pointer;font-size:13px;color:#fff;font-weight:600}
.popup-edit-btn:hover{background:#1557b0}
.popup-del-btn{background:none;border:1px solid #e74c3c;padding:8px 14px;border-radius:7px;cursor:pointer;font-size:13px;color:#e74c3c;font-weight:600}
.popup-del-btn:hover{background:#fdf0ee}

/* ===== MODAL SECUNDARIO (estado / tipo) ===== */
.submodal-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;align-items:center;justify-content:center}
.submodal-backdrop.open{display:flex}
.submodal-box{background:#fff;border-radius:14px;width:320px;max-width:92vw;padding:20px;box-shadow:0 8px 32px rgba(0,0,0,.2)}
.submodal-title{font-size:14px;font-weight:600;color:var(--text);margin-bottom:14px;text-align:center}
.submodal-btns{display:flex;flex-direction:column;gap:10px}
.sub-btn{border:none;border-radius:10px;padding:14px 16px;font-size:14px;font-weight:700;cursor:pointer;text-align:left;letter-spacing:.3px;transition:transform .1s}
.sub-btn:hover{transform:scale(1.02)}
.submodal-cancel{margin-top:10px;width:100%;background:none;border:1px solid var(--border);border-radius:8px;padding:10px;font-size:13px;cursor:pointer;color:var(--muted)}
</style>
</head>

    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeModal()">Cancelar</button>
      <button class="btn-save" onclick="saveEvent()">Guardar</button>
    </div>
  </div>
</div>

<!-- SUBMODAL ESTADO / CATEGORIA -->
<div class="submodal-backdrop" id="submodal" onclick="closeSubOut(event)">
  <div class="submodal-box">
    <div class="submodal-title" id="submodal-title"></div>
    <div class="submodal-btns" id="submodal-btns"></div>
    <button class="submodal-cancel" onclick="closeSubModal()">Cancelar</button>
  </div>
</div>

<script>
const MONTHS_ES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const DAYS_ES=['lunes','martes','miércoles','jueves','viernes','sábado','domingo'];
const today=new Date();today.setHours(0,0,0,0);
let cur=new Date(today.getFullYear(),today.getMonth(),1);
let events=[];

// Estado del formulario
let selTipoEvento=null, selGestores=new Set(), selEstado=null, selCategoria=null;
let selCliente='', selAgencia='';
let subModalTarget=null;

const TIPO_COLORS={'CASA DE PAPEL':'#c0392b','INTOCABLES':'#1a73e8','A TEMPO':'#7d5a3c','CONCURSO PISTA':'#27ae60','CONCURSO LIVE MUSIC':'#e67e22','OTROS':'#5b9bd5'};

const ESTADOS=[
  {label:'Posible',color:'#f39c12',text:'#7d5a00'},
  {label:'Confirmado',color:'#3498db',text:'#0a3d62'},
  {label:'Finalizado',color:'#95a5a6',text:'#2c3e50'},
  {label:'Aplazado',color:'#a8d8a8',text:'#1a5c1a'},
];
const CATEGORIAS=[
  {label:'Team Building',color:'#5b9bd5',text:'#0a3d62'},
  {label:'Espectáculos y Eventos',color:'#f39c12',text:'#7d5a00'},
  {label:'Formación',color:'#a8d8a8',text:'#1a5c1a'},
  {label:'Ponencia',color:'#f8c8d4',text:'#8b1a2e'},
];

// Datos de ejemplo (luego vendrán de Google Sheets)
let DB_CLIENTES=['Banco Santander','Coca-Cola España','El Corte Inglés','Ferrovial','Iberdrola','Inditex','MAPFRE','Mercadona','Repsol','Telefónica'];
let DB_AGENCIAS=['Agencia Creativa BCN','Eventalia','Grupo Eventoplus','ilusiona Eventos','Mònica Serrano Events','Producciones XYZ','Wonder Events'];

function pad(n){return String(n).padStart(2,'0')}
function sameDay(a,b){return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate()}
function capFirst(s){return s.charAt(0).toUpperCase()+s.slice(1)}
function dowLun(d){return(d.getDay()+6)%7}

function renderAll(){
  document.getElementById('main-label').textContent=capFirst(MONTHS_ES[cur.getMonth()])+' '+cur.getFullYear();
  renderGrid();
}
const TIPO_SHORT={'CASA DE PAPEL':'C.PAPEL','INTOCABLES':'INTOC.','A TEMPO':'A TEMPO','CONCURSO PISTA':'C.PISTA','CONCURSO LIVE MUSIC':'C.LIVE','OTROS':'OTROS'};
const ESTADO_COLORS={'Posible':'#e0a800','Confirmado':'#1a73e8','Finalizado':'#7f8c8d','Aplazado':'#5daa5d'};

function renderGrid(){
  const g=document.getElementById('month-grid');
  const first=new Date(cur.getFullYear(),cur.getMonth(),1);
  const last=new Date(cur.getFullYear(),cur.getMonth()+1,0);
  const startDow=dowLun(first);
  const totalCells=Math.ceil((startDow+last.getDate())/7)*7;
  let html='';
  for(let i=0;i<totalCells;i++){
    const dt=new Date(first);dt.setDate(dt.getDate()-startDow+i);
    const isThisMonth=dt.getMonth()===cur.getMonth();
    const isToday=sameDay(dt,today);
    const dayEvs=events.filter(e=>sameDay(e.date,dt));
    const ds=`${dt.getFullYear()}-${pad(dt.getMonth()+1)}-${pad(dt.getDate())}`;
    html+=`<div class="month-cell${isThisMonth?'':' other-month'}" onclick="cellClick(event,'${ds}')">
      <div class="cell-num${isToday?' today':''}">${dt.getDate()}</div>
      <div class="cell-events">`;
    dayEvs.slice(0,3).forEach((ev,idx)=>{
      const bg=ESTADO_COLORS[ev.estado]||'#888';
      const short=TIPO_SHORT[ev.tipo]||ev.tipo.slice(0,6);
      const pax=ev.pax?` · ${ev.pax}p`:'';
      const pob=ev.poblacion?` · ${ev.poblacion}`:'';
      const evIdx=events.indexOf(ev);
      html+=`<div class="cell-event" style="background:${bg}" 
        onclick="event.stopPropagation();showPopup(${evIdx},this)"
        ondblclick="event.stopPropagation();editEventByIdx(${evIdx})"
      >${ev.startTime} ${short}${pax}${pob}</div>`;
    });
    if(dayEvs.length>3)html+=`<div class="cell-more">+${dayEvs.length-3} más</div>`;
    html+=`</div></div>`;
  }
  g.innerHTML=html;
}
function shiftMonth(n){cur=new Date(cur.getFullYear(),cur.getMonth()+n,1);renderAll()}
function goToday(){cur=new Date(today.getFullYear(),today.getMonth(),1);renderAll()}

// ---- MODAL PRINCIPAL ----
function openModal(dateStr){
  const d=new Date(dateStr+'T00:00:00');
  const dow=DAYS_ES[dowLun(d)];
  document.getElementById('modal-date-label').textContent=capFirst(dow)+', '+d.getDate()+' de '+MONTHS_ES[d.getMonth()]+' '+d.getFullYear();
  // reset todo
  selTipoEvento=null;selGestores=new Set();selEstado=null;selCategoria=null;selCliente='';selAgencia='';
  window._editIdx=null;
  document.querySelectorAll('.tipo-btn').forEach(b=>b.classList.remove('selected'));
  document.querySelectorAll('.gestor-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('ev-start').value='20:00';
  document.getElementById('ev-end').value='23:00';
  document.getElementById('ev-pax').value='';
  document.getElementById('cliente-input').value='';
  document.getElementById('agencia-input').value='';
  setEstadoBadge(null);
  setCategoriaBadge(null);
  document.getElementById('modal').classList.add('open');
  window._currentDate=new Date(dateStr+'T00:00:00');
}
function closeModal(){document.getElementById('modal').classList.remove('open')}
function closeOut(e){if(e.target===document.getElementById('modal'))closeModal()}

function recalcEnd(){
  if(!selTipoEvento)return;
  const startVal=document.getElementById('ev-start').value;
  if(!startVal)return;
  const [h,m]=startVal.split(':').map(Number);
  const esConcurso=selTipoEvento==='CONCURSO PISTA'||selTipoEvento==='CONCURSO LIVE MUSIC';
  const mins=h*60+m+(esConcurso?90:150);
  document.getElementById('ev-end').value=`${pad(Math.floor(mins/60)%24)}:${pad(mins%60)}`;
}

function selTipo(el){
  document.querySelectorAll('.tipo-btn').forEach(b=>b.classList.remove('selected'));
  el.classList.add('selected');selTipoEvento=el.dataset.tipo;
  // calcular hora fin automática
  const startVal=document.getElementById('ev-start').value;
  if(startVal){
    const [h,m]=startVal.split(':').map(Number);
    const esConcurso=el.dataset.tipo==='CONCURSO PISTA'||el.dataset.tipo==='CONCURSO LIVE MUSIC';
    const mins=h*60+m+(esConcurso?90:150);
    const hFin=Math.floor(mins/60)%24;
    const mFin=mins%60;
    document.getElementById('ev-end').value=`${pad(hFin)}:${pad(mFin)}`;
  }
}
function toggleGestor(el){
  el.classList.toggle('active');
  const g=el.dataset.gestor;
  if(selGestores.has(g))selGestores.delete(g); else selGestores.add(g);
}

// Badges de estado y categoría
function setEstadoBadge(item){
  const lbl=document.getElementById('estado-label');
  const badge=document.getElementById('estado-badge');
  if(!item){lbl.textContent='Toca para seleccionar';lbl.style.display='';badge.innerHTML='';return}
  lbl.style.display='none';
  badge.innerHTML=`<span class="sel-badge" style="background:${item.color};color:${item.text}">${item.label}</span>`;
  selEstado=item.label;
}
function setCategoriaBadge(item){
  const lbl=document.getElementById('categoria-label');
  const badge=document.getElementById('categoria-badge');
  if(!item){lbl.textContent='Toca para seleccionar';lbl.style.display='';badge.innerHTML='';return}
  lbl.style.display='none';
  badge.innerHTML=`<span class="sel-badge" style="background:${item.color};color:${item.text}">${item.label}</span>`;
  selCategoria=item.label;
}

// ---- SUBMODAL ----
function openSubModal(target){
  subModalTarget=target;
  const isEstado=target==='estado';
  document.getElementById('submodal-title').textContent=isEstado?'Selecciona el estado':'Selecciona la categoría';
  const items=isEstado?ESTADOS:CATEGORIAS;
  document.getElementById('submodal-btns').innerHTML=items.map((it,i)=>
    `<button class="sub-btn" style="background:${it.color};color:${it.text}" onclick="pickSubModal(${i})">${it.label}</button>`
  ).join('');
  document.getElementById('submodal').classList.add('open');
}
function pickSubModal(i){
  const items=subModalTarget==='estado'?ESTADOS:CATEGORIAS;
  if(subModalTarget==='estado')setEstadoBadge(items[i]);
  else setCategoriaBadge(items[i]);
  closeSubModal();
}
function closeSubModal(){document.getElementById('submodal').classList.remove('open')}
function closeSubOut(e){if(e.target===document.getElementById('submodal'))closeSubModal()}

// ---- AUTOCOMPLETE ----
function filterAC(type){
  const input=document.getElementById(type+'-input').value.toLowerCase();
  const db=type==='cliente'?DB_CLIENTES:DB_AGENCIAS;
  const filtered=db.filter(x=>x.toLowerCase().includes(input));
  renderDropdown(type,filtered,input);
}
function showAC(type){
  const input=document.getElementById(type+'-input').value.toLowerCase();
  const db=type==='cliente'?DB_CLIENTES:DB_AGENCIAS;
  renderDropdown(type,db.filter(x=>x.toLowerCase().includes(input)),input);
}
function hideAC(type,delay){setTimeout(()=>{document.getElementById(type+'-dropdown').classList.remove('open')},delay)}
function renderDropdown(type,items,query){
  const dd=document.getElementById(type+'-dropdown');
  let html=items.map(it=>`<div class="ac-item" onmousedown="pickAC('${type}','${it.replace(/'/g,"\\'")}')"> ${it}</div>`).join('');
  if(query&&!items.some(x=>x.toLowerCase()===query)){
    html+=`<div class="ac-add" onmousedown="addToDb('${type}')">＋ Añadir "${document.getElementById(type+'-input').value}"</div>`;
  }
  dd.innerHTML=html;
  dd.classList.toggle('open',html.length>0);
}
function pickAC(type,val){
  document.getElementById(type+'-input').value=val;
  document.getElementById(type+'-dropdown').classList.remove('open');
  if(type==='cliente')selCliente=val; else selAgencia=val;
}
function addToDb(type){
  const val=document.getElementById(type+'-input').value.trim();
  if(!val)return;
  if(type==='cliente'){if(!DB_CLIENTES.includes(val))DB_CLIENTES.push(val);selCliente=val;}
  else{if(!DB_AGENCIAS.includes(val))DB_AGENCIAS.push(val);selAgencia=val;}
  document.getElementById(type+'-dropdown').classList.remove('open');
}

// ---- CLICK EN CELDA (zona vacía = nuevo evento) ----
function cellClick(e, dateStr){
  closePopup();
  openModal(dateStr);
}

// ---- POPUP RESUMEN ----
let _popupEvIdx=null;
function showPopup(idx, el){
  closePopup();
  _popupEvIdx=idx;
  const ev=events[idx];
  const d=ev.date;
  const dow=DAYS_ES[dowLun(d)];

  // colores estado
  const estadoBg=ESTADO_COLORS[ev.estado]||'#888';
  const estadoTexts={'Posible':'#7d5a00','Confirmado':'#0a3d62','Finalizado':'#2c3e50','Aplazado':'#1a5c1a'};
  const estadoTxt=estadoTexts[ev.estado]||'#fff';

  document.getElementById('popup-dot').style.background=estadoBg;
  document.getElementById('popup-titulo').textContent=ev.tipo;
  document.getElementById('popup-fecha').textContent=capFirst(dow)+', '+d.getDate()+' de '+MONTHS_ES[d.getMonth()]+' '+d.getFullYear();
  document.getElementById('popup-hora').textContent=ev.startTime+' – '+ev.endTime;

  const rowEstado=document.getElementById('popup-row-estado');
  if(ev.estado){
    rowEstado.style.display='flex';
    document.getElementById('popup-estado').innerHTML=`<span class="popup-badge" style="background:${estadoBg};color:${estadoTxt}">${ev.estado}</span>`;
  } else rowEstado.style.display='none';

  const rowPax=document.getElementById('popup-row-pax');
  if(ev.pax){rowPax.style.display='flex';document.getElementById('popup-pax').textContent=ev.pax+' personas';}
  else rowPax.style.display='none';

  const rowPob=document.getElementById('popup-row-pob');
  if(ev.poblacion){rowPob.style.display='flex';document.getElementById('popup-pob').textContent=ev.poblacion;}
  else rowPob.style.display='none';

  const rowCli=document.getElementById('popup-row-cliente');
  if(ev.cliente){rowCli.style.display='flex';document.getElementById('popup-cliente').textContent=ev.cliente;}
  else rowCli.style.display='none';

  const rowAge=document.getElementById('popup-row-agencia');
  if(ev.agencia){rowAge.style.display='flex';document.getElementById('popup-agencia').textContent=ev.agencia;}
  else rowAge.style.display='none';

  const rowGes=document.getElementById('popup-row-gestores');
  if(ev.gestores&&ev.gestores.length){rowGes.style.display='flex';document.getElementById('popup-gestores').textContent=ev.gestores.join(', ');}
  else rowGes.style.display='none';

  // posicionar popup cerca del elemento pulsado
  const popup=document.getElementById('popup');
  popup.classList.add('open');
  const rect=el.getBoundingClientRect();
  const pw=popup.offsetWidth||320;
  const ph=popup.offsetHeight||300;
  let top=rect.bottom+8;
  let left=rect.left;
  if(left+pw>window.innerWidth-8)left=window.innerWidth-pw-8;
  if(left<8)left=8;
  if(top+ph>window.innerHeight-8)top=rect.top-ph-8;
  if(top<8)top=8;
  popup.style.top=top+'px';
  popup.style.left=left+'px';
}

function closePopup(){
  document.getElementById('popup').classList.remove('open');
  _popupEvIdx=null;
}

function deleteEvent(){
  if(_popupEvIdx===null)return;
  if(confirm('¿Eliminar este evento?')){
    events.splice(_popupEvIdx,1);
    closePopup();
    renderGrid();
  }
}

function editEvent(){
  if(_popupEvIdx===null)return;
  editEventByIdx(_popupEvIdx);
  closePopup();
}

function editEventByIdx(idx){
  const ev=events[idx];
  window._editIdx=idx;
  // abrir modal con datos del evento
  const d=ev.date;
  const ds=`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  openModal(ds);
  // rellenar campos
  setTimeout(()=>{
    // tipo
    document.querySelectorAll('.tipo-btn').forEach(b=>{
      if(b.dataset.tipo===ev.tipo){b.classList.add('selected');selTipoEvento=ev.tipo;}
    });
    // horario
    document.getElementById('ev-start').value=ev.startTime;
    document.getElementById('ev-end').value=ev.endTime;
    // pax
    document.getElementById('ev-pax').value=ev.pax||'';
    // estado
    if(ev.estado){
      const est=ESTADOS.find(e=>e.label===ev.estado);
      if(est)setEstadoBadge(est);
    }
    // categoria
    if(ev.categoria){
      const cat=CATEGORIAS.find(c=>c.label===ev.categoria);
      if(cat)setCategoriaBadge(cat);
    }
    // cliente / agencia
    document.getElementById('cliente-input').value=ev.cliente||'';
    document.getElementById('agencia-input').value=ev.agencia||'';
    selCliente=ev.cliente||'';selAgencia=ev.agencia||'';
    // gestores
    selGestores=new Set(ev.gestores||[]);
    document.querySelectorAll('.gestor-btn').forEach(b=>{
      if(selGestores.has(b.dataset.gestor))b.classList.add('active');
    });
  },50);
}

// cerrar popup al pulsar fuera
document.addEventListener('click',e=>{
  const popup=document.getElementById('popup');
  if(popup.classList.contains('open')&&!popup.contains(e.target)){closePopup();}
});

// ---- GUARDAR (con soporte edición) ----
function saveEvent(){
  if(!selTipoEvento){alert('Selecciona el tipo de evento');return}
  if(selGestores.size===0){alert('Selecciona quién gestiona');return}
  const evData={
    date:new Date(window._currentDate),
    tipo:selTipoEvento,
    startTime:document.getElementById('ev-start').value,
    endTime:document.getElementById('ev-end').value,
    pax:document.getElementById('ev-pax').value,
    estado:selEstado,
    categoria:selCategoria,
    cliente:selCliente||document.getElementById('cliente-input').value,
    agencia:selAgencia||document.getElementById('agencia-input').value,
    gestores:Array.from(selGestores),
    poblacion:document.getElementById('ev-poblacion').value
  };
  if(window._editIdx!==undefined&&window._editIdx!==null){
    events[window._editIdx]=evData;
    window._editIdx=null;
  } else {
    events.push(evData);
  }
  closeModal();renderGrid();
}

renderAll();
</script>


</body></html>

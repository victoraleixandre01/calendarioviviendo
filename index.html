<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Google Sans',Roboto,Arial,sans-serif}
:root{--gc-blue:#1a73e8;--gc-blue-light:#e8f0fe;--gc-surface:#fff;--gc-bg:#f6f8fc;--gc-border:#dadce0;--gc-text:#3c4043;--gc-muted:#70757a;--gc-hover:#f1f3f4}
html,body{height:100%;background:var(--gc-bg);color:var(--gc-text);font-size:14px}
.cal-root{display:flex;flex-direction:column;height:100vh;overflow:hidden}

/* TOPBAR */
.topbar{height:60px;display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--gc-border);background:var(--gc-surface);flex-shrink:0}
.topbar-logo{font-size:20px;color:var(--gc-muted);font-weight:400;letter-spacing:-.5px}
.topbar-logo span{color:var(--gc-blue)}
.today-btn{border:1px solid var(--gc-border);background:var(--gc-surface);border-radius:4px;padding:7px 14px;font-size:13px;cursor:pointer;color:var(--gc-text);font-weight:500}
.today-btn:hover{background:var(--gc-hover)}
.nav-btn{background:none;border:none;cursor:pointer;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--gc-muted)}
.nav-btn:hover{background:var(--gc-hover)}
.topbar-month{font-size:18px;font-weight:400;color:var(--gc-text);flex:1}

/* GRID MES */
.month-wrap{flex:1;display:flex;flex-direction:column;overflow:hidden}
.month-dow-header{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--gc-border);background:var(--gc-surface);flex-shrink:0}
.month-dow{text-align:center;padding:6px 0;font-size:11px;font-weight:500;color:var(--gc-muted);letter-spacing:.3px}
.month-grid{flex:1;display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:1fr;border-left:1px solid var(--gc-border);overflow:hidden}
.month-cell{border-right:1px solid var(--gc-border);border-bottom:1px solid var(--gc-border);padding:4px;cursor:pointer;background:var(--gc-surface);overflow:hidden}
.month-cell:hover{background:#fafafa}
.month-cell.other-month{background:var(--gc-bg)}
.month-cell.other-month .cell-num{color:#bbb}
.cell-num{font-size:12px;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-bottom:2px;color:var(--gc-text)}
.cell-num.today{background:var(--gc-blue);color:#fff;font-weight:500}
.cell-events{display:flex;flex-direction:column;gap:2px}
.cell-event{font-size:10px;font-weight:600;color:#fff;border-radius:3px;padding:1px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell-more{font-size:10px;color:var(--gc-muted);padding:1px 4px}

/* MODAL */
.modal-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;align-items:flex-end;justify-content:center}
@media(min-width:600px){.modal-backdrop{align-items:center}}
.modal-backdrop.open{display:flex}
.modal-box{background:#fff;border-radius:16px 16px 0 0;width:100%;max-height:92vh;overflow-y:auto}
@media(min-width:600px){.modal-box{border-radius:14px;width:520px;max-height:90vh}}
.modal-head{padding:16px 18px 10px;border-bottom:1px solid var(--gc-border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:#fff;z-index:2}
.modal-head-date{font-size:15px;font-weight:600;color:var(--gc-text)}
.modal-head-close{background:none;border:none;font-size:20px;cursor:pointer;color:var(--gc-muted);width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.modal-head-close:hover{background:var(--gc-hover)}
.modal-body{padding:16px 18px}
.section-label{font-size:10px;font-weight:600;color:var(--gc-muted);letter-spacing:.9px;text-transform:uppercase;margin-bottom:10px}

/* Tipos */
.tipo-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:20px}
.tipo-btn{border:none;border-radius:10px;padding:16px 8px;font-size:13px;font-weight:700;color:#fff;cursor:pointer;text-transform:uppercase;letter-spacing:.3px;transition:transform .12s,box-shadow .12s,opacity .12s;opacity:.75}
.tipo-btn:hover{opacity:.9}
.tipo-btn.selected{opacity:1;transform:scale(1.04);box-shadow:0 0 0 3px #fff,0 0 0 5px currentColor,0 6px 20px rgba(0,0,0,.25)}

/* Horario */
.horario-row{display:flex;gap:12px;margin-bottom:18px}
.form-group{display:flex;flex-direction:column;gap:5px;flex:1}
.form-group label{font-size:10px;font-weight:600;color:var(--gc-muted);letter-spacing:.7px;text-transform:uppercase}
.form-group input[type=time],.form-group select{border:1px solid var(--gc-border);border-radius:8px;padding:9px 10px;font-size:14px;color:var(--gc-text);outline:none;background:#fff;width:100%}
.form-group input[type=time]:focus,.form-group select:focus{border-color:var(--gc-blue)}

/* Gestor */
.gestor-row{display:flex;gap:10px;margin-bottom:8px}
.gestor-btn{flex:1;border:3px solid transparent;border-radius:10px;padding:14px 6px;font-size:13px;font-weight:700;color:#fff;cursor:pointer;text-transform:uppercase;letter-spacing:.4px;transition:all .15s;opacity:.35;filter:grayscale(50%)}
.gestor-btn.active{opacity:1;filter:none;box-shadow:0 0 0 3px #fff, 0 0 20px 5px rgba(0,0,0,.2);transform:scale(1.07)}

/* Footer */
.modal-footer{padding:12px 18px 20px;display:flex;justify-content:flex-end;gap:10px;border-top:1px solid var(--gc-border);position:sticky;bottom:0;background:#fff}
.btn-cancel{background:none;border:1px solid var(--gc-border);padding:9px 18px;border-radius:7px;cursor:pointer;font-size:14px;color:var(--gc-muted)}
.btn-save{background:var(--gc-blue);border:none;padding:9px 22px;border-radius:7px;cursor:pointer;font-size:14px;color:#fff;font-weight:600}
.btn-save:hover{background:#1557b0}
</style>
</head>

<script>
const MONTHS_ES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const DAYS_ES=['lunes','martes','miércoles','jueves','viernes','sábado','domingo'];
const today=new Date();today.setHours(0,0,0,0);
let cur=new Date(today.getFullYear(),today.getMonth(),1);
let selectedTipo=null,selectedGestor=null,currentDate=null;
let events=[];
const TIPO_COLORS={'CASA DE PAPEL':'#c0392b','INTOCABLES':'#1a73e8','A TEMPO':'#7d5a3c','CONCURSO PISTA':'#27ae60','CONCURSO LIVE MUSIC':'#e67e22','OTROS':'#5b9bd5'};

function pad(n){return String(n).padStart(2,'0')}
function sameDay(a,b){return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate()}
function capFirst(s){return s.charAt(0).toUpperCase()+s.slice(1)}
function dowLun(d){return(d.getDay()+6)%7}

function renderAll(){
  document.getElementById('main-label').textContent=capFirst(MONTHS_ES[cur.getMonth()])+' '+cur.getFullYear();
  renderGrid();
}

function renderGrid(){
  const g=document.getElementById('month-grid');
  const first=new Date(cur.getFullYear(),cur.getMonth(),1);
  const last=new Date(cur.getFullYear(),cur.getMonth()+1,0);
  const startDow=dowLun(first);
  const totalCells=Math.ceil((startDow+last.getDate())/7)*7;
  let html='';
  for(let i=0;i<totalCells;i++){
    const dt=new Date(first);dt.setDate(dt.getDate()-startDow+i);
    const isThisMonth=dt.getMonth()===cur.getMonth();
    const isToday=sameDay(dt,today);
    const dayEvs=events.filter(e=>sameDay(e.date,dt)).sort((a,b)=>a.startTime.localeCompare(b.startTime));
    const ds=`${dt.getFullYear()}-${pad(dt.getMonth()+1)}-${pad(dt.getDate())}`;
    html+=`<div class="month-cell${isThisMonth?'':' other-month'}" onclick="openModal('${ds}')">
      <div class="cell-num${isToday?' today':''}">${dt.getDate()}</div>
      <div class="cell-events">`;
    dayEvs.slice(0,3).forEach(ev=>{
      const color=TIPO_COLORS[ev.tipo]||'#888';
      html+=`<div class="cell-event" style="background:${color}">${ev.startTime} ${ev.tipo}</div>`;
    });
    if(dayEvs.length>3)html+=`<div class="cell-more">+${dayEvs.length-3} más</div>`;
    html+=`</div></div>`;
  }
  g.innerHTML=html;
}

function shiftMonth(n){cur=new Date(cur.getFullYear(),cur.getMonth()+n,1);renderAll()}
function goToday(){cur=new Date(today.getFullYear(),today.getMonth(),1);renderAll()}

function openModal(dateStr){
  currentDate=new Date(dateStr+'T00:00:00');
  selectedTipo=null;selectedGestor=null;
  document.querySelectorAll('.tipo-btn').forEach(b=>b.classList.remove('selected'));
  document.querySelectorAll('.gestor-btn').forEach(b=>b.classList.remove('active'));
  const d=currentDate;
  const dow=DAYS_ES[dowLun(d)];
  document.getElementById('modal-date-label').textContent=capFirst(dow)+', '+d.getDate()+' de '+MONTHS_ES[d.getMonth()]+' '+d.getFullYear();
  document.getElementById('ev-start-time').value='20:00';
  document.getElementById('ev-end-time').value='23:00';
  document.getElementById('ev-poblacion').value='';
  document.getElementById('modal').classList.add('open');
}
function closeModal(){document.getElementById('modal').classList.remove('open')}
function closeOut(e){if(e.target===document.getElementById('modal'))closeModal()}

function selTipo(el){
  document.querySelectorAll('.tipo-btn').forEach(b=>b.classList.remove('selected'));
  el.classList.add('selected');selectedTipo=el.dataset.tipo;
}
function selGestor(el){
  document.querySelectorAll('.gestor-btn').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');selectedGestor=el.dataset.gestor;
}
function saveEvent(){
  if(!selectedTipo){alert('Selecciona el tipo de evento');return}
  if(!selectedGestor){alert('Selecciona quién gestiona');return}
  events.push({date:new Date(currentDate),tipo:selectedTipo,startTime:document.getElementById('ev-start-time').value,endTime:document.getElementById('ev-end-time').value,poblacion:document.getElementById('ev-poblacion').value,gestor:selectedGestor});
  closeModal();renderGrid();
}
renderAll();
</script>
